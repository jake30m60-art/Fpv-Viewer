plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.herbert.fpvviewer'
    compileSdk 34

    defaultConfig {
        applicationId "com.herbert.fpvviewer"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // UVC-Kamera / Capture-Card Library (liest USB Video Class Geräte aus)
    // WICHTIG: Falls Android Studio diese Zeile nicht findet/Gradle-Sync fehlschlägt,
    // UVC-Kamera / Capture-Card Library (liest USB Video Class Geräte aus)
    // Aktiv gepflegter Fork (das Original wird nicht mehr zuverlässig gepflegt/gebaut)
    implementation 'com.github.ernestp.AndroidUSBCamera:libausbc:3.6.0'
}
